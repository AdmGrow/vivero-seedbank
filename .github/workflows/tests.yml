name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -v
      - name: Prueba de la consola con el CSV de ejemplo
        run: |
          export SEEDBANK_DB="$RUNNER_TEMP/ci.db"
          seedbank import examples/lotes_ejemplo.csv
          seedbank sembrar EJ-002 --celdas 72 --fecha 2026-09-01
          seedbank germinacion B001 --germinadas 60
          seedbank list
          seedbank informe
